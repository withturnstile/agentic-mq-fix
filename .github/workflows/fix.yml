# Reusable workflow that agentic-mq (known-broken-gate) dispatches when a failure is confirmed
# broken on the default branch. Call it from a stub in your repo; see README.md.
name: agentic-mq fix

on:
  workflow_call:
    inputs:
      setup:
        description: Shell commands that install your dependencies (e.g. "npm ci"), so the agent can run the failing tests.
        type: string
        default: ""
      node-version:
        description: Node.js version to install before setup. Empty uses the runner's default Node.
        type: string
        default: ""
      python-version:
        description: Python version to install before setup. Empty skips it.
        type: string
        default: ""
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-latest
      model:
        description: Claude model for the agent.
        type: string
        default: claude-opus-5-5
    secrets:
      anthropic-api-key:
        description: Anthropic API key the agent runs with.
        required: true

permissions:
  contents: read

jobs:
  fix:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    concurrency:
      group: agentic-mq-fix-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.base_sha }}
          # History lets the agent find the changes that conflict.
          fetch-depth: 200
          persist-credentials: false

      - if: inputs.node-version != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - if: inputs.python-version != ''
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        if: inputs.setup != ''
        shell: bash
        run: ${{ inputs.setup }}

      - uses: withturnstile/agentic-mq-fix@358e1a41468f119a4a764b68e0e10ef3a0c8d764
        with:
          anthropic-api-key: ${{ secrets.anthropic-api-key }}
          model: ${{ inputs.model }}
