name: agentic-mq fix agent
description: Runs a Claude agent to fix failures known-broken-gate confirmed on the default branch, and uploads the patch for the app to open as a pull request.
inputs:
  anthropic-api-key:
    description: Anthropic API key the agent runs with.
    required: true
  model:
    description: Claude model for the agent.
    default: claude-opus-5-5
  max-turns:
    description: Upper bound on agent turns. The spend limit comes from fix.max_budget_usd in .github/known-broken.yml.
    default: "60"
runs:
  using: composite
  steps:
    - name: Install the agent
      shell: bash
      run: |
        dir="$RUNNER_TEMP/known-broken-agent"
        mkdir -p "$dir"
        cp "$GITHUB_ACTION_PATH/fix.mjs" "$GITHUB_ACTION_PATH/lib.mjs" "$dir/"
        cd "$dir"
        echo '{"type":"module","private":true}' > package.json
        npm install --no-audit --no-fund --silent @anthropic-ai/claude-agent-sdk@0.3.300

    - name: Run the agent
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        KBG_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        KBG_MODEL: ${{ inputs.model }}
        KBG_MAX_TURNS: ${{ inputs.max-turns }}
        KBG_OUT: ${{ runner.temp }}/known-broken-out
      run: node "$RUNNER_TEMP/known-broken-agent/fix.mjs"

    - name: Upload the result for known-broken-gate
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: known-broken-fix-${{ github.event.client_payload.attempt_id }}
        path: ${{ runner.temp }}/known-broken-out/
        if-no-files-found: error
        retention-days: 7
